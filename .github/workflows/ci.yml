name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-runs. Releases are not tied to CI: the Release workflow runs
  # when a version tag is pushed (see .github/workflows/release.yml).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / build (node ${{ matrix.node }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # postinstall also fixes node-pty's spawn-helper permissions.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build renderer
        run: npm run build
